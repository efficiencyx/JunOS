name: CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: PHP lint
        run: |
          sudo apt-get update && sudo apt-get install -y php-cli
          find webapp/api tools -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Python compile
        run: |
          python -m py_compile tts/server.py

      - name: Compose config
        run: docker compose config -q

      - name: Shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './docker'
