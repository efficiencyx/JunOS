name: Release installer

# push a v* tag and this builds JunSetup-<tag>.exe, JunOS.exe
# (the start/stop/update window install.ps1 downloads) and
# JunOS-<tag>.apk (the android app) and puts them, the three
# install scripts and their SHA256SUMS on a DRAFT release for
# that tag. the exe is pinned: it carries the tag and the commit the
# tag points at, and install.ps1 refuses to set up anything else.
# versioned names ONLY. no unversioned JunSetup.exe / JunOS.apk
# copy, so there's no releases/latest/download/ link for either,
# the docs point at the releases/latest page and you pick the file.
# JunOS.exe keeps its plain name, install.ps1 downloads it by that.
# a tag with a - in it (v1.2.0-beta) drafts as a pre-release. untick
# that before publishing if the one-liners should get it, they come
# from releases/latest/download/ and /latest skips pre-releases.
# a tag ending in -security (v1.2.1-security, v1.2.1-beta-security)
# drafts as a full release, see SECURITY.md for when to cut one.
# the notes and the publish button are still yours.
#
# draft, not published. re-pushing the tag refills the same draft
# (--clobber), that's how a draft gets new code. a draft you made
# by hand in the UI for the same tag gets the files too. a
# published release makes this job fail ON PURPOSE: people already
# downloaded those files and checked them against SHA256SUMS.
# put it back to draft first if you really mean to replace them.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    name: JunSetup.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        # powershell (5.1), not pwsh: ps2exe emits a .NET Framework WPF binary
        # and targets the framework host.
        shell: powershell
        # the ref goes in through the environment, not the script text.
        # a tag name can hold $( ) and powershell would run it.
        env:
          JUN_RELEASE_REF: ${{ github.ref_name }}
          JUN_RELEASE_IS_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          $pin = @{}
          $out = 'dist\JunSetup.exe'
          if ($env:JUN_RELEASE_IS_TAG -eq 'true') {
            # HEAD, not github.sha. for an annotated tag the checkout is
            # the commit, and that's the hash install.ps1 compares against.
            $pin = @{ PinRef = $env:JUN_RELEASE_REF; PinSha = (git rev-parse HEAD).Trim() }
            $out = "dist\JunSetup-$($env:JUN_RELEASE_REF).exe"
          }
          $tag = $env:JUN_RELEASE_REF -replace '^v', '' -replace '-.*$', ''
          # ps2exe wants a 4 part numeric version and a tag like v1.2 is not
          # one. pad it, and fall back for workflow_dispatch where ref_name is
          # a branch.
          if ($tag -notmatch '^\d+(\.\d+)*$') { $tag = '0.0.0' }
          $parts = @($tag -split '\.') + @('0', '0', '0', '0')
          # manager first, the setup exe carries a copy of it
          ./tools/build-installer-exe.ps1 -Manager -Version ($parts[0..3] -join '.') -OutputPath dist\JunOS.exe
          ./tools/build-installer-exe.ps1 -Version ($parts[0..3] -join '.') -OutputPath $out -EmbedManager dist\JunOS.exe @pin

      - uses: actions/upload-artifact@v7
        with:
          name: JunSetup
          path: |
            dist/JunSetup*.exe
            dist/JunOS.exe

  android:
    name: JunOS.apk
    runs-on: ubuntu-latest
    # the signing secrets live in the release environment, which only
    # lets v* tags in. a dispatch from a branch would get the job
    # rejected outright, so it skips the environment and builds
    # unsigned instead (the Keystore step below warns about it)
    environment: ${{ github.ref_type == 'tag' && 'release' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # the versionCode is the commit count, a shallow clone says 1
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v7
        id: python312
        with:
          python-version: '3.12'

      - name: Point Chaquopy at python 3.12
        run: echo "JUN_PYTHON_312=${{ steps.python312.outputs.python-path }}" >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: ~/.gradle/junos-bootstrap
          key: gradle-bootstrap-9.8.2

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Keystore
        # every apk ever shipped has to be signed by this SAME key.
        # android refuses an update signed by anything else, and the
        # only way out is uninstall, which takes her chats and the
        # 2.5 GB model with it. so a tag without the secret fails here
        # instead of shipping an unsigned apk nobody can install.
        env:
          KEYSTORE_BASE64: ${{ secrets.JUN_ANDROID_KEYSTORE_BASE64 }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$IS_TAG" = true ]; then
              echo "::error::no JUN_ANDROID_KEYSTORE_BASE64 secret, not shipping an unsigned apk"
              exit 1
            fi
            echo "::warning::no JUN_ANDROID_KEYSTORE_BASE64 secret, the apk is unsigned"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "JUN_ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        working-directory: android
        env:
          JUN_ANDROID_STORE_PASSWORD: ${{ secrets.JUN_ANDROID_STORE_PASSWORD }}
          JUN_ANDROID_KEY_ALIAS: ${{ secrets.JUN_ANDROID_KEY_ALIAS }}
          JUN_ANDROID_KEY_PASSWORD: ${{ secrets.JUN_ANDROID_KEY_PASSWORD }}
          REF: ${{ github.ref_name }}
        run: |
          # android won't install a lower versionCode over a higher
          # one. commit count only goes up as long as nobody rewrites
          # the history of the repo that pushes the tags.
          JUN_ANDROID_VERSION_CODE="$(git rev-list --count HEAD)"
          export JUN_ANDROID_VERSION_CODE
          name="${REF#v}"
          case "$name" in [0-9]*) ;; *) name="0.0.0-${name//\//-}" ;; esac
          export JUN_ANDROID_VERSION_NAME="$name"
          # verifyReleaseContents builds the release apk and fails it on
          # model files, game assets or anything past 180 MiB
          sh ./gradlew :app:verifyReleaseContents --no-daemon

          out="$GITHUB_WORKSPACE/dist"
          mkdir -p "$out"
          if [ -n "${JUN_ANDROID_KEYSTORE:-}" ]; then
            apksigner="$(printf '%s\n' "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
            "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
            cp app/build/outputs/apk/release/app-release.apk "$out/JunOS-${REF//\//-}.apk"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "$out/JunOS-${REF//\//-}-unsigned.apk"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: JunOS-android
          path: dist/JunOS-*.apk

  draft:
    name: Draft release
    needs: [installer, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: JunSetup
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: JunOS-android
          path: dist

      - name: Attach to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          exe="JunSetup-$TAG.exe"
          apk="JunOS-$TAG.apk"
          for f in "$exe" JunOS.exe "$apk"; do
            [ -f "dist/$f" ] || { echo "::error::dist/$f missing, the build job named it something else"; exit 1; }
          done
          cp install.sh install.ps1 installer-gui.ps1 dist/
          (cd dist && sha256sum "$exe" JunOS.exe "$apk" install.sh install.ps1 installer-gui.ps1 > SHA256SUMS)

          # gh release view finds drafts by tag too, the plain API doesn't
          if gh release view "$TAG" --json isDraft --jq .isDraft > state 2>/dev/null; then
            if [ "$(cat state)" != true ]; then
              echo "::error::$TAG is already published, not overwriting files people already downloaded. set it back to draft first if you mean it."
              exit 1
            fi
            # drafts from before the versioned-only switch still carry
            # these, with old bytes and no line in SHA256SUMS
            for old in JunSetup.exe JunOS.apk; do
              gh release delete-asset "$TAG" "$old" --yes 2>/dev/null || true
            done
          else
            pre=""
            # a -security release has to reach Stable and the
            # releases/latest one-liners, start scripts refuse to boot
            # the version it fixes
            case "$TAG" in *-security) ;; *-*) pre="--prerelease" ;; esac
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes $pre
          fi
          gh release upload "$TAG" "dist/$exe" dist/JunOS.exe "dist/$apk" dist/install.sh dist/install.ps1 dist/installer-gui.ps1 dist/SHA256SUMS --clobber
