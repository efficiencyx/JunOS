name: Bug report
description: Report a reproducible problem with Jun OS
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make Jun OS better. Please search existing issues first.

        Do not post passwords, API or registration keys, private chat content, recovered game assets, or other copyrighted game files. Report security vulnerabilities through the private advisory link instead.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the open and closed issues for this problem.
          required: true
        - label: This is not an exploitable security vulnerability.
          required: true
        - label: I removed secrets, private chat data, and recovered game assets from this report.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Installation or upgrade
        - Docker or service startup
        - Chat or model provider
        - Voice, speech-to-text, or text-to-speech
        - Karaoke
        - Live2D, wardrobe, or mods
        - Android app
        - Google Colab
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options:
        - Docker on Linux, macOS, or WSL
        - Bare-metal Windows
        - Google Colab
        - Android
        - Other or not applicable
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Paste the release tag or output of `git rev-parse --short HEAD`.
      placeholder: v1.2.3 or a1b2c3d
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, browser, GPU, provider, and relevant enabled profiles. Write "not applicable" for anything unrelated.
      placeholder: |
        OS: Ubuntu 24.04
        Browser: Firefox 141
        GPU: NVIDIA RTX 3060 12 GB
        Provider/model: Ollama / ...
        Profiles: ollama, karaoke
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and its impact.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Give the smallest reliable sequence that triggers the problem.
      placeholder: |
        1. Start Jun OS with ...
        2. Open ...
        3. Select ...
        4. See ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste only the relevant excerpt. Redact keys, tokens, user data, local paths that identify you, and copyrighted asset data.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add screenshots, configuration details, or possible causes if useful. Do not attach recovered game assets or private conversations.

