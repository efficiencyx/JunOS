# Shared security headers.
#
# nginx's add_header does not inherit into a location that declares its own
# add_header, so every location adding a header has to restate the whole set.
# Keeping them here means the CSP is edited in one place instead of six.
#
# HSTS is not here: it only applies to the certbot TLS server, which adds it
# alongside this include.

add_header X-Content-Type-Options     "nosniff"                         always;
add_header X-Frame-Options            "DENY"                            always;
add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
add_header Permissions-Policy         "microphone=(self), camera=(), geolocation=()" always;
add_header Content-Security-Policy    "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' data:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'" always;
