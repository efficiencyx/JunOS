<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<script defer src="js/viewport.js?v=3"></script>
<title>Out to eat</title>
<link rel="icon" type="image/png" href="jun_os.png">
<link rel="stylesheet" href="trip-loader.css?v=3">
<link rel="stylesheet" href="date.css?v=6">
</head>
<body>
<main class="date-layout">
  <a class="date-back" href="index.html">← Back to chat</a>
  <section class="restaurant" aria-label="Your table">
    <div class="room" aria-hidden="true"></div>
    <div id="stage"></div>
    <div class="table" aria-hidden="true"></div>
    <div id="stageStatus" role="status">Loading…</div>
  </section>

  <section class="menu-card" id="menuCard" aria-labelledby="menuTitle">
    <div class="page page-left">
      <p class="page-names" id="menuNames">Anon &amp; Jun</p>
      <p class="page-date" id="menuDate"></p>
      <p class="page-place" id="menuPlace"></p>
    </div>
    <div class="page page-right">
      <h2 class="menu-title" id="menuTitle"><svg class="flourish" viewBox="0 0 60 20" aria-hidden="true"><path d="M2 12Q14 2 30 10T58 8M18 12Q22 4 30 10" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>Menu<svg class="flourish mirror" viewBox="0 0 60 20" aria-hidden="true"><path d="M2 12Q14 2 30 10T58 8M18 12Q22 4 30 10" fill="none" stroke="currentColor" stroke-width="1.1"/></svg></h2>
      <div class="menu-list" id="menuList" aria-describedby="menuHint"></div>
      <p class="menu-hint" id="menuHint"></p>
    </div>
  </section>

  <form class="composer" id="composer" autocomplete="off">
    <p class="last-line" id="lastLine" aria-live="polite"></p>
    <div class="composer-row">
      <input id="sayInput" type="text" maxlength="500" placeholder="Say something…" aria-label="Say something" disabled>
      <button type="submit" id="sendBtn" disabled>Say</button>
      <button type="button" id="orderBtn" disabled>Call the waiter</button>
      <button type="button" id="billBtn" hidden>Ask for the bill</button>
    </div>
  </form>
</main>

<script defer src="vendor/live2dcubismcore.min.js"></script>
<script defer src="vendor/pixi.min.js"></script>
<script defer src="vendor/pixi-unsafe-eval.min.js"></script>
<script defer src="vendor/cubism4.min.js"></script>
<script defer src="js/auth.js?v=4"></script>
<script defer src="js/prefs.js?v=4"></script>
<script defer src="js/names.js?v=4"></script>
<script defer src="js/chat-api.js?v=6"></script>
<script type="module" src="js/live2d.js?v=10"></script>
<script defer src="js/mods.js?v=15"></script>
<script defer src="js/outfit.js?v=22"></script>
<script defer src="js/tts.js?v=3"></script>
<script defer src="js/wardrobe-reactions.js?v=5"></script>
<script defer src="js/skybox.js?v=1"></script>
<script defer src="js/scene.js?v=1"></script>
<script defer src="js/trip-loader.js?v=4"></script>
<script defer src="js/date.js?v=5"></script>
</body>
</html>
