<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<script defer src="js/viewport.js?v=3"></script>
<title>Out to eat</title>
<link rel="icon" type="image/png" href="jun_os.png">
<link rel="stylesheet" href="trip-loader.css?v=1">
<link rel="stylesheet" href="date.css?v=3">
</head>
<body>
<main class="date-layout">
  <section class="restaurant" aria-label="Your table">
    <div class="room" aria-hidden="true">
      <div class="window"><div class="window-lights"></div></div>
      <div class="wall-light wall-light-left"></div><div class="wall-light wall-light-right"></div>
      <div class="banquette"></div>
    </div>
    <header class="scene-head">
      <span class="eyebrow">A little time together</span>
      <h1 id="pageTitle">Table for <em>two.</em></h1>
      <div class="scene-detail"><span class="ambience-dot"></span><span id="mealLabel">Your table is ready</span></div>
    </header>
    <div id="stage"></div>
    <div class="table" aria-hidden="true">
      <svg viewBox="0 0 1000 430" preserveAspectRatio="none">
        <defs>
          <linearGradient id="linen" x2="0.2" y2="1"><stop stop-color="#e1cfac"/><stop offset=".5" stop-color="#bc9f78"/><stop offset="1" stop-color="#8a6547"/></linearGradient>
          <radialGradient id="porcelain"><stop stop-color="#fffaf0"/><stop offset=".7" stop-color="#e9ddca"/><stop offset=".74" stop-color="#c9bca6"/><stop offset=".8" stop-color="#fff7e7"/><stop offset="1" stop-color="#dbceb6"/></radialGradient>
          <linearGradient id="silver"><stop stop-color="#8f8373"/><stop offset=".45" stop-color="#fff4dc"/><stop offset=".6" stop-color="#b5a48b"/><stop offset="1" stop-color="#68594b"/></linearGradient>
          <linearGradient id="glass" x2="1" y2="0"><stop stop-color="#fff2d4" stop-opacity=".28"/><stop offset=".4" stop-color="#fff2d4" stop-opacity=".04"/><stop offset="1" stop-color="#fff2d4" stop-opacity=".3"/></linearGradient>
          <radialGradient id="candleGlow"><stop stop-color="#ffc86a" stop-opacity=".5"/><stop offset="1" stop-color="#ffc86a" stop-opacity="0"/></radialGradient>
          <pattern id="weave" width="5" height="5" patternUnits="userSpaceOnUse"><path d="M0 0H5M0 0V5" stroke="#fff" stroke-opacity=".045"/></pattern>
          <g id="plate"><ellipse cy="7" rx="113" ry="43" fill="#513d2a" opacity=".22"/><ellipse rx="112" ry="42" fill="url(#porcelain)"/><ellipse rx="102" ry="36" fill="none" stroke="#a78c5c" stroke-width="1.5"/><ellipse rx="77" ry="26" fill="none" stroke="#cbb99b"/></g>
          <g id="fork" fill="url(#silver)"><path d="M-7-34h3v20h3v-20h3v20h3v-20h3v25Q8-1 2 2L4 56Q0 62-4 56L-2 2Q-8-1-7-9Z"/></g>
          <g id="knife" fill="url(#silver)"><path d="M0-35Q12-20 9 6L4 12 6 58Q1 63-2 58L-2-34Z"/></g>
          <g id="wineglass"><ellipse cy="59" rx="20" ry="5" fill="url(#glass)" stroke="#f1dcb9" stroke-opacity=".45"/><path d="M0 23V57M-20-30Q-30 18 0 23Q30 18 20-30Z" fill="url(#glass)" stroke="#f1dcb9" stroke-opacity=".5"/><path d="M-22-5Q-20 20 0 21Q20 20 22-5Q0 1-22-5" fill="#6b2835" opacity=".8"/><path d="M-15-24Q-20-10-16 3" fill="none" stroke="#fff2d4" stroke-opacity=".65" stroke-width="2"/></g>
        </defs>
        <ellipse cx="500" cy="290" rx="630" ry="245" fill="#261b15"/>
        <ellipse cx="500" cy="263" rx="625" ry="228" fill="url(#linen)"/>
        <ellipse cx="500" cy="263" rx="625" ry="228" fill="url(#weave)"/>
        <path d="M387 42L266 430H653L580 40" fill="#f6e6c9" opacity=".3"/>
        <path d="M394 43L276 430M574 42L644 430" stroke="#ede0c8" stroke-opacity=".35" stroke-width="2"/>
        <g transform="translate(505 111) scale(.78)"><use href="#plate"/><use href="#fork" x="-137"/><use href="#knife" x="136"/></g>
        <g transform="translate(405 322) scale(1.3)"><path d="M-160-37l37 3-8 86-37-6Z" fill="#795052"/><use href="#plate"/><use href="#fork" x="-142"/><use href="#knife" x="140"/></g>
        <use href="#wineglass" transform="translate(670 74) scale(.8)"/>
        <use href="#wineglass" transform="translate(626 233) scale(1.15)"/>
        <ellipse cx="270" cy="155" rx="118" ry="74" fill="url(#candleGlow)"/>
        <ellipse cx="270" cy="175" rx="31" ry="11" fill="#614a35" opacity=".4"/>
        <ellipse cx="270" cy="170" rx="27" ry="9" fill="#aa8651"/>
        <path d="M257 161L260 98H280L283 161Q270 169 257 161" fill="#f8e7ba"/>
        <ellipse cx="270" cy="98" rx="10" ry="4" fill="#fff4d7"/>
        <path d="M270 97v-7" stroke="#503421" stroke-width="2"/>
        <g class="flame"><path d="M270 94Q254 84 271 65Q283 86 270 94" fill="#ffcc6f"/><path d="M270 93Q264 88 271 78Q277 88 270 93" fill="#fff6ca"/></g>
        <text id="plateHer" x="505" y="117" text-anchor="middle" font-size="34"></text>
        <text id="plateMe" x="405" y="333" text-anchor="middle" font-size="57"></text>
      </svg>
    </div>
    <div id="stageStatus" role="status">Loading…</div>
  </section>

  <section class="menu-card" id="menuCard" aria-labelledby="menuTitle">
    <div class="page page-left">
      <p class="page-names" id="menuNames">Anon &amp; Jun</p>
      <p class="page-date" id="menuDate"></p>
      <p class="page-place" id="menuPlace"></p>
    </div>
    <div class="page page-right">
      <h2 class="menu-title" id="menuTitle"><svg class="flourish" viewBox="0 0 60 20" aria-hidden="true"><path d="M2 12Q14 2 30 10T58 8M18 12Q22 4 30 10" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>Menu<svg class="flourish mirror" viewBox="0 0 60 20" aria-hidden="true"><path d="M2 12Q14 2 30 10T58 8M18 12Q22 4 30 10" fill="none" stroke="currentColor" stroke-width="1.1"/></svg></h2>
      <div class="menu-list" id="menuList" aria-describedby="menuHint"></div>
      <p class="menu-hint" id="menuHint"></p>
    </div>
  </section>

  <form class="composer" id="composer" autocomplete="off">
    <p class="last-line" id="lastLine" aria-live="polite"></p>
    <div class="composer-row">
      <input id="sayInput" type="text" maxlength="500" placeholder="Say something…" aria-label="Say something" disabled>
      <button type="submit" id="sendBtn" disabled>Say</button>
      <button type="button" id="orderBtn" disabled>Call the waiter</button>
      <button type="button" id="billBtn" hidden>Ask for the bill</button>
    </div>
  </form>
</main>

<script defer src="vendor/live2dcubismcore.min.js"></script>
<script defer src="vendor/pixi.min.js"></script>
<script defer src="vendor/pixi-unsafe-eval.min.js"></script>
<script defer src="vendor/cubism4.min.js"></script>
<script defer src="js/auth.js?v=4"></script>
<script defer src="js/prefs.js?v=4"></script>
<script defer src="js/names.js?v=4"></script>
<script defer src="js/chat-api.js?v=6"></script>
<script type="module" src="js/live2d.js?v=10"></script>
<script defer src="js/mods.js?v=15"></script>
<script defer src="js/outfit.js?v=22"></script>
<script defer src="js/tts.js?v=3"></script>
<script defer src="js/wardrobe-reactions.js?v=5"></script>
<script defer src="js/trip-loader.js?v=3"></script>
<script defer src="js/date.js?v=3"></script>
</body>
</html>
