<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<script defer src="js/viewport.js?v=3"></script>
<title>Out to eat</title>
<link rel="icon" type="image/png" href="jun_os.png">
<link rel="stylesheet" href="trip-loader.css?v=1">
<style>
:root {
  --panel-w: 400px;
  --bg-2: #1c1410;
  --bg-3: #241a14;
  --border: rgba(255,255,255,0.06);
  --border-2: rgba(255,255,255,0.14);
  --fg: #f1e8dc;
  --muted: rgba(255,255,255,0.45);
  --accent: #f0b070;
  --accent-soft: rgba(240,176,112,0.12);
  --gold: rgba(255,220,160,0.35);
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; height: 100dvh; }
body {
  margin: 0;
  font: 14px/1.45 system-ui, sans-serif;
  color: var(--fg);
  background:
    radial-gradient(ellipse 55% 70% at 38% 40%, #4a2c1c 0%, transparent 70%),
    radial-gradient(ellipse 30% 20% at 30% 96%, rgba(240,176,112,0.28), transparent 70%),
    linear-gradient(180deg, #1a120e 0%, #0d0907 100%);
  overflow: hidden;
}
button { font: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#stage { position: fixed; inset: 0 var(--panel-w) 0 0; }
.candle {
  position: fixed;
  left: calc((100vw - var(--panel-w)) / 2 - 260px);
  bottom: -60px;
  width: 520px; height: 200px;
  border-radius: 50%;
  background: radial-gradient(ellipse at center, rgba(240,176,112,0.18), transparent 70%);
  pointer-events: none;
  animation: flicker 3.2s ease-in-out infinite;
}
@keyframes flicker { 50% { opacity: 0.8; transform: scaleX(1.04); } }
.page-title {
  position: fixed; top: 26px; left: 30px;
  font-family: var(--serif);
  font-size: 26px; font-style: italic; letter-spacing: 0.04em;
  color: var(--muted);
  pointer-events: none;
}
.page-title b { color: var(--accent); font-weight: 600; }
.page-title::after {
  content: ""; display: block; margin-top: 8px;
  width: 64px; height: 1px;
  background: linear-gradient(90deg, var(--gold), transparent);
}
#stageStatus {
  position: fixed; left: 30px; bottom: 20px;
  font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--muted); opacity: 0.85;
}

.menu {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: var(--panel-w);
  display: flex;
  flex-direction: column;
  background: linear-gradient(180deg, var(--bg-2) 0%, #120c09 100%);
  border-left: 1px solid var(--border);
  box-shadow: -24px 0 60px rgba(0,0,0,0.5);
  z-index: 60;
}
.menu-head { padding: 20px 22px 14px; border-bottom: 1px solid var(--border); }
.menu-title { font-family: var(--serif); font-size: 20px; font-style: italic; color: var(--fg); }
.menu-hint { margin-top: 4px; font-size: 11px; color: var(--muted); letter-spacing: 0.02em; }
.menu-list { flex: 1; overflow-y: auto; padding: 8px 12px; }
.dish {
  display: grid; grid-template-columns: 32px 1fr auto auto; align-items: center; gap: 8px;
  padding: 10px 10px; border-radius: 8px;
}
.dish:hover { background: var(--bg-3); }
.dish-emoji { font-size: 20px; text-align: center; }
.dish-name { color: var(--fg); }
.dish button {
  border: 1px solid var(--border-2); background: none; color: var(--muted);
  font-size: 11px; padding: 5px 10px; border-radius: 6px;
  transition: border-color 0.15s, color 0.15s;
}
.dish button:hover { border-color: var(--accent); color: var(--accent); }
.dish button.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.dish button:disabled { opacity: 0.4; cursor: default; }
.menu-foot { padding: 14px 22px 20px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
.menu-order {
  padding: 11px 16px; border-radius: 8px; border: 0;
  background: var(--accent); color: #2a1810; font-weight: 700;
}
.menu-order:disabled { opacity: 0.4; cursor: default; }
.menu-summary { font-size: 12px; color: var(--muted); min-height: 1.4em; }
.menu-bill {
  padding: 10px 16px; border-radius: 8px;
  border: 1px solid var(--border-2); background: none; color: var(--fg);
}
.menu-bill[hidden] { display: none; }

@media (max-width: 900px) {
  :root { --panel-w: 0px; }
  #stage { inset: 0 0 46dvh 0; }
  .menu { top: auto; height: 46dvh; width: 100%; border-left: 0; border-top: 1px solid var(--border); }
  .page-title { font-size: 20px; top: 16px; left: 16px; }
  .candle { left: calc(50vw - 260px); bottom: calc(46dvh - 60px); }
  #stageStatus { display: none; }
}
</style>
</head>
<body>
<div class="candle" aria-hidden="true"></div>
<div class="page-title" id="pageTitle">Out to <b>eat</b></div>
<div id="stage"></div>
<div id="stageStatus">Loading…</div>

<section class="menu" aria-label="Menu">
  <div class="menu-head">
    <div class="menu-title" id="menuTitle">Menu</div>
    <div class="menu-hint">Pick one thing for you and one for her, then order.</div>
  </div>
  <div class="menu-list" id="menuList"></div>
  <div class="menu-foot">
    <div class="menu-summary" id="menuSummary"></div>
    <button class="menu-order" id="orderBtn" disabled>Order</button>
    <button class="menu-bill" id="billBtn" hidden>Ask for the bill</button>
  </div>
</section>

<script defer src="vendor/live2dcubismcore.min.js"></script>
<script defer src="vendor/pixi.min.js"></script>
<script defer src="vendor/pixi-unsafe-eval.min.js"></script>

<script defer src="js/prefs.js?v=4"></script>

<script defer src="js/chat-api.js?v=6"></script>

<script defer src="js/mods.js?v=14"></script>
<script defer src="js/outfit.js?v=21"></script>
<script defer src="js/tts.js?v=3"></script>
<script defer src="js/wardrobe-reactions.js?v=5"></script>
<script defer src="js/trip-loader.js?v=3"></script>
<script defer src="js/date.js?v=1"></script>
</body>
</html>
