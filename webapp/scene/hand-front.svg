    <stop offset="0" stop-color="#c6ac96"/><stop offset=".55" stop-color="#a18577"/><stop offset="1" stop-color="#574852"/>
  </linearGradient>
  <linearGradient id="hf-rim" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" class="hf-rim" stop-opacity=".24"/><stop offset=".35" class="hf-rim" stop-opacity="0"/>
  </linearGradient>
</defs>
