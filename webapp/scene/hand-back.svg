<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1000">
<!-- the hand holding the phone, the part BEHIND it. same viewBox
     as hand-front.svg and the phone sits at x 100-400, y 100-715
     in both, welcome.css lays the html phone over exactly that box.
     only the fingertips past the left edge and the palm under the
     bottom ever show, the rest is behind the screen. -->
<style>
  .hb-rim { stop-color: var(--scene-tint, #ffc98a); }
</style>
<defs>
  <linearGradient id="hb-skin" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#b49a88"/><stop offset=".6" stop-color="#8c7068"/><stop offset="1" stop-color="#49414b"/>
  </linearGradient>
  <linearGradient id="hb-finger" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c1a48e"/><stop offset=".7" stop-color="#92756b"/><stop offset="1" stop-color="#4b414b"/>
  </linearGradient>
  <linearGradient id="hb-rim" x1="1" y1="0" x2="0" y2="0">
    <stop offset="0" class="hb-rim" stop-opacity=".22"/><stop offset=".4" class="hb-rim" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="hb-sleeve" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#34333e"/><stop offset="1" stop-color="#171720"/>
  </linearGradient>
</defs>
<g fill="url(#hb-finger)">
  <path d="M200 430c-40-6-92-2-114 8-18 8-18 34 0 42 26 10 76 8 114 2z"/>
  <path d="M200 500c-44-4-96 0-118 10-18 8-18 34 0 42 26 10 80 8 118 2z"/>
