<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 400" preserveAspectRatio="none">
<!-- fitting room curtain fabric, tiled horizontally as a CSS
     background. one repeat is 120 wide: four folds, uneven, because
     gathered fabric does not land on a grid.
     no custom properties in here - it is loaded as a background
     image, which is its own document and cannot see them. -->
<defs>
  <linearGradient id="cu-fold" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#200c1a"/>
    <stop offset=".14" stop-color="#6d3459"/>
    <stop offset=".26" stop-color="#8a4571"/>
    <stop offset=".38" stop-color="#4a2038"/>
    <stop offset=".5" stop-color="#1d0a17"/>
    <stop offset=".62" stop-color="#5b2b4a"/>
    <stop offset=".74" stop-color="#7c3d66"/>
    <stop offset=".86" stop-color="#3a1a2e"/>
    <stop offset="1" stop-color="#200c1a"/>
  </linearGradient>
  <linearGradient id="cu-drop" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".07"/>
    <stop offset=".45" stop-color="#000000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000000" stop-opacity=".45"/>
  </linearGradient>
</defs>
<rect width="120" height="400" fill="url(#cu-fold)"/>
<!-- the velvet nap: fine vertical streaks, not a clean gradient -->
<g stroke="#12060f" stroke-opacity=".3" stroke-width="1">
  <path d="M8 0v400M23 0v400M41 0v400M57 0v400M72 0v400M88 0v400M104 0v400M116 0v400"/>
</g>
<g stroke="#a55f8a" stroke-opacity=".16" stroke-width="1.5">
  <path d="M16 0v400M32 0v400M64 0v400M96 0v400"/>
</g>
<rect width="120" height="400" fill="url(#cu-drop)"/>
</svg>
