    <g fill="#b23a2c"><ellipse cx="-24" cy="-11" rx="8" ry="4"/><ellipse cx="18" cy="-13" rx="8" ry="4"/><ellipse cx="0" cy="1" rx="7" ry="3.5"/></g>
    <ellipse cx="-4" cy="-14" rx="5" ry="2.6" fill="#3f7a35"/>
