    <path d="M-20-48 20-48 17 13Q0 18-17 13Z" fill="#f5e7a6" opacity=".85"/>
    <g fill="#fff" opacity=".45"><rect x="-12" y="-44" width="12" height="11" rx="2" transform="rotate(10 -6 -38)"/></g>
    <path d="M-6-36 4-86" stroke="#d4607a" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-20" cy="-62" r="12" fill="#f6d743" stroke="#e3b42a" stroke-width="2"/>
    <path d="M-20-62v-10M-20-62h10M-20-62l-7-7M-20-62l7-7" stroke="#fbeba0" stroke-width="1.6"/>
  </g>
  <g id="fd-steak">
    <use href="#fd-shadow"/>
    <path d="M-60 0Q-62-22-32-24Q-2-28 6-12Q12 2-8 10Q-42 16-60 0Z" fill="#6a3019"/>
    <path d="M-58-4Q-60-22-32-22Q-4-25 3-12Q8-2-10 4Q-42 10-58-4Z" fill="#8a4428"/>
    <path d="M-48-6-30-20M-34-2-14-18M-20 2-2-12" stroke="#3e1d10" stroke-width="3" stroke-linecap="round"/>
