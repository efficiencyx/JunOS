    <path d="M-52-9q3-3 6 0t6 0" fill="none" stroke="#fde0cc" stroke-width="1.4"/>
    <g transform="translate(46 -6)"><ellipse rx="11" ry="7" fill="#1f2a22"/><ellipse cy="-1" rx="8" ry="4.6" fill="#f7f3ea"/><ellipse cy="-1" rx="3.4" ry="2" fill="#f08a5d"/></g>
