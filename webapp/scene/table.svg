    <ellipse cy="-10" rx="64" ry="15" fill="#5f201d"/>
    <ellipse cy="-10" rx="58" ry="12.5" fill="#d79a4e"/>
    <path d="M-46-7q8-6 16 0t16 0 16 0 16 0 16 0M-34-14q8-5 16 0t16 0 16 0" fill="none" stroke="#f3dca0" stroke-width="3"/>
    <ellipse cx="-24" cy="-14" rx="12" ry="5.5" fill="#dca58e" stroke="#9a5a44" stroke-width="1.6"/>
    <ellipse cx="22" cy="-13" rx="11" ry="6" fill="#fbf4e2"/><ellipse cx="22" cy="-13" rx="5.5" ry="3.2" fill="#f0a23a"/>
