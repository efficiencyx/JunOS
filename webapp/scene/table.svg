  <path d="M268 93Q262 87 269 76Q276 87 268 93" fill="#fff8d4"/>
</g>

<!-- same transforms as the two plates above. the inner g is
     what fades in, a CSS transform on it would wipe the attribute -->
<g transform="translate(505 111) scale(.78)"><g id="plateHer" class="food"></g></g>
<g transform="translate(402 322) scale(1.32)"><g id="plateMe" class="food"></g></g>
