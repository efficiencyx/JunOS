    <path d="M-70 10Q-66-22-34-24Q-4-22-2 10Q-36 18-70 10Z" fill="#f7f1e3"/>
    <path d="M-56-6q4-3 8 0M-40-14q4-3 8 0M-30-2q4-3 8 0M-50 4q4-3 8 0" fill="none" stroke="#ddd3bd" stroke-width="1.6"/>
    <g transform="rotate(-8)" fill="#d99a3c" stroke="#a8661f" stroke-width="1.6">
      <rect x="-8" y="-28" width="15" height="21" rx="3"/><rect x="8" y="-27" width="15" height="21" rx="3"/>
      <rect x="24" y="-26" width="15" height="21" rx="3"/><rect x="40" y="-25" width="13" height="20" rx="3"/>
    </g>
  </g>
  <g id="fd-salad">
