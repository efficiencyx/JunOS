    <g fill="#fff" opacity=".4"><rect x="-14" y="-40" width="13" height="12" rx="2" transform="rotate(-12 -8 -34)"/><rect x="2" y="-30" width="12" height="11" rx="2" transform="rotate(14 8 -24)"/></g>
    <path d="M8-30 18-84" stroke="#2f6f6a" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g id="fd-lemonade">
