    <g fill="#6e9e3a"><ellipse cx="-30" cy="-6" rx="24" ry="13" transform="rotate(-14 -30 -6)"/><ellipse cx="22" cy="-8" rx="26" ry="13" transform="rotate(12 22 -8)"/></g>
    <g fill="#8cbd4f"><ellipse cx="-6" cy="-14" rx="24" ry="12"/><ellipse cx="38" cy="2" rx="18" ry="9"/></g>
    <ellipse cx="-40" cy="4" rx="16" ry="8" fill="#8a3555"/>
    <g fill="#d9e8b0" stroke="#5d8a34" stroke-width="2"><ellipse cx="10" cy="4" rx="8" ry="5"/><ellipse cx="-20" cy="6" rx="8" ry="5"/></g>
    <g fill="#d23a2e"><circle cx="-14" cy="-10" r="7"/><circle cx="28" cy="-12" r="7"/><circle cx="44" cy="-6" r="6"/></g>
    <g fill="#fff" opacity=".5"><circle cx="-16" cy="-12" r="2"/><circle cx="26" cy="-14" r="2"/></g>
