    <path d="M-34-4q8-10 16 0t16 0 16 0 16 0" fill="none" stroke="#c4302b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#5f8f34"><circle cx="40" cy="-6" r="2"/><circle cx="-42" cy="2" r="2"/></g>
