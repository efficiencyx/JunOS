<svg xmlns="http://www.w3.org/2000/svg">
<!-- PROP: clothes rail, Annalie's.
     local box 310 x 262, origin top left. the pipe runs along y=6,
     uprights drop to the floor at y=258. the room slot owns the
     translate and the tilt, this file owns nothing outside the box.
     drop-in replaceable: keep the box and the pipe line, change
     whatever else you like.

     light comes from upper LEFT, so every garment is lit down its
     left edge and shaded down its right. keep that or the prop
     stops sitting in the room. -->
<defs>
  <linearGradient id="rl-pipe" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2f2a36"/><stop offset=".28" stop-color="#b3adb9"/>
    <stop offset=".58" stop-color="#5d5768"/><stop offset="1" stop-color="#211c2a"/>
  </linearGradient>
  <linearGradient id="rl-post" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5b5466"/><stop offset=".4" stop-color="#3a3445"/><stop offset="1" stop-color="#211c2a"/>
  </linearGradient>
</defs>

<g stroke="#8f8a99" stroke-width="2.5" fill="none" stroke-linecap="round">
  <path d="M54 22q0-8 5.5-8t5.5 5.5"/>
  <path d="M122 18q0-8 5.5-8t5.5 5.5"/>
  <path d="M190 24q0-8 5.5-8t5.5 5.5"/>
  <path d="M256 20q0-8 5.5-8t5.5 5.5"/>
</g>
<g stroke="#a19cab" stroke-width="3" fill="none" stroke-linejoin="round">
  <path d="M54 22 36 41h36z"/>
  <path d="M122 18 104 37h36z"/>
  <path d="M190 24 172 43h36z"/>
  <path d="M256 20 238 39h36z"/>
</g>

<!-- 1. long coat. heavy linen, hangs straight, the only garment
        with real sleeves on show -->
<g>
  <path d="M30 46q-11 4-14 13L5 92l15 8 9-20-4 128q26 9 52 0l-4-128 9 20 15-8-11-33q-3-9-14-13l-11 7z" fill="#7d7660" stroke="#3f3a2c" stroke-width="1.6"/>
  <path d="M54 53l-4 196q14 2 25-1l-4-128 9 20 15-8-11-33q-3-9-14-13z" fill="#221f16" opacity=".3"/>
  <path d="M30 46q-11 4-14 13L5 92l15 8 9-20-3 92 8-142z" fill="#e2dcc4" opacity=".13"/>
  <path d="M43 60l-3 182M62 62l2 180" stroke="#2c2921" stroke-opacity=".28" stroke-width="1.6" fill="none"/>
  <path d="M41 46h26l-13 9z" fill="#2c2921" opacity=".45"/>
</g>

<!-- 2. the dress. Annalie's magenta, the one thing in here that is
        actually her colour -->
<g>
  <path d="M100 44q-9 3-12 11l-6 26 12 6 5-18-9 152q28 10 56 0l-9-152 5 18 12-6-6-26q-3-8-12-11l-13 9z" fill="#a04a86" stroke="#4f1f42" stroke-width="1.6"/>
  <path d="M122 53l9 168q13 1 24-2l-9-152 5 18 12-6-6-26q-3-8-12-11z" fill="#320f29" opacity=".33"/>
  <path d="M100 44q-9 3-12 11l-6 26 12 6 5-18-6 100 7-125z" fill="#ffc6e9" opacity=".17"/>
  <path d="M111 66l-4 154M133 68l5 152" stroke="#4f1f42" stroke-opacity=".3" stroke-width="1.6" fill="none"/>
  <path d="M109 44h26l-13 10z" fill="#4f1f42" opacity=".5"/>
</g>

<!-- 3. short shirt. cold green so the rail is not four warms in a
        row, and it stops well above the others -->
<g>
  <path d="M170 50q-10 3-13 12l-10 30 14 7 7-19-3 98h50l-3-98 7 19 14-7-10-30q-3-9-13-12l-12 8z" fill="#3f5f5c" stroke="#223634" stroke-width="1.6"/>
  <path d="M190 58l3 120h22l-3-98 7 19 14-7-10-30q-3-9-13-12z" fill="#0e1d1c" opacity=".33"/>
  <path d="M170 50q-10 3-13 12l-10 30 14 7 7-19-2 62 4-92z" fill="#c8ece7" opacity=".14"/>
  <path d="M181 68l-2 108M201 70l2 106" stroke="#223634" stroke-opacity=".3" stroke-width="1.6" fill="none"/>
  <path d="M178 50h24l-12 9z" fill="#223634" opacity=".5"/>
</g>

<!-- 4. jacket, shoved along to the end and half off the rail -->
<g transform="rotate(3 262 44)">
  <path d="M238 46q-11 4-14 13l-11 31 15 8 8-20-4 136q27 9 54 0l-4-136 8 20 15-8-11-31q-3-9-14-13l-13 8z" fill="#5f5769" stroke="#332e3c" stroke-width="1.6"/>
  <path d="M262 54l4 178q14 1 26-2l-4-136 8 20 15-8-11-31q-3-9-14-13z" fill="#1c1823" opacity=".34"/>
  <path d="M238 46q-11 4-14 13l-11 31 15 8 8-20-5 88 7-120z" fill="#ddd6e8" opacity=".14"/>
  <path d="M250 62l-2 164M275 64l3 162" stroke="#332e3c" stroke-opacity=".3" stroke-width="1.6" fill="none"/>
  <path d="M249 46h26l-13 9z" fill="#2a2532" opacity=".5"/>
  <rect x="277" y="150" width="14" height="20" rx="2" fill="#b8508f" opacity=".8"/>
</g>

<!-- pipe last so it reads in front of the hooks -->
<rect x="0" y="0" width="310" height="12" rx="3" fill="url(#rl-pipe)"/>
<rect x="12" y="10" width="9" height="248" fill="url(#rl-post)"/>
<rect x="288" y="10" width="9" height="248" fill="url(#rl-post)"/>
<path d="M-4 252h42v9H-4zM274 252h42v9h-42z" fill="#2a2432"/>
</svg>
