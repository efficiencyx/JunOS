<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 150" preserveAspectRatio="xMidYMid meet">
<!-- PROP: the deck, card room. box 110 x 150.
     face down, squared up, sitting where the dealer left it. the
     back pattern matches .cards-overlay .card.down in cards.css -
     change both or neither. -->
<defs>
  <pattern id="dk-back" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <path d="M0 0v12M6 0v12" stroke="#e2c994" stroke-opacity=".28" stroke-width="1.4"/>
  </pattern>
</defs>
<!-- the stack under the top card, just edges -->
<g>
  <rect x="12" y="34" width="80" height="112" rx="6" fill="#2a251d"/>
  <rect x="12" y="30" width="80" height="112" rx="6" fill="#efe7dd"/>
  <rect x="12" y="26" width="80" height="112" rx="6" fill="#8a7b62"/>
  <rect x="12" y="22" width="80" height="112" rx="6" fill="#efe7dd"/>
  <rect x="12" y="18" width="80" height="112" rx="6" fill="#8a7b62"/>
</g>
<rect x="12" y="10" width="80" height="112" rx="6" fill="#254d40" stroke="#eee6dd" stroke-width="5"/>
<rect x="17" y="15" width="70" height="102" rx="3" fill="url(#dk-back)"/>
<rect x="22" y="20" width="60" height="92" rx="2" fill="none" stroke="#e2c994" stroke-opacity=".5" stroke-width="1.4"/>
<path d="M52 48c-9 12-16 17-16 25a8 8 0 0 0 13 6l-3 9h12l-3-9a8 8 0 0 0 13-6c0-8-7-13-16-25z" fill="#eee0b9"/>
