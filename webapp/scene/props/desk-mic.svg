<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 260" preserveAspectRatio="xMidYMax meet">
<!-- PROP: desk mic, the fat usb kind streamers put in front of
     their face. capsule on a U yoke on a weighted base. box 120 x
     260, the base sits on the bottom edge, which karaoke-page.js
     parks on the table at 90% of the room height -->
<defs>
  <linearGradient id="dm-body" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#120d18"/><stop offset=".25" stop-color="#4a4156"/>
    <stop offset=".48" stop-color="#8a7f98"/><stop offset=".72" stop-color="#3a3245"/>
    <stop offset="1" stop-color="#0d0912"/>
  </linearGradient>
  <linearGradient id="dm-grille" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#1c1624"/><stop offset=".3" stop-color="#9d93aa"/>
    <stop offset=".5" stop-color="#d4ccdc"/><stop offset=".75" stop-color="#5d5369"/>
    <stop offset="1" stop-color="#15101c"/>
  </linearGradient>
  <linearGradient id="dm-base" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#6d6279"/><stop offset=".35" stop-color="#2b2433"/><stop offset="1" stop-color="#0c0910"/>
  </linearGradient>
</defs>

<ellipse cx="60" cy="252" rx="58" ry="8" fill="#050308" opacity=".6"/>
<path d="M6 236q0-12 14-12h80q14 0 14 12v10q0 8-12 8H18q-12 0-12-8z" fill="url(#dm-base)" stroke="#4d4459" stroke-width="1.5"/>
<path d="M52 204h16v22H52z" fill="url(#dm-body)"/>

<!-- the yoke. two arms from the pivots down to the neck -->
<path d="M20 112v72q0 22 22 22h36q22 0 22-22v-72" fill="none" stroke="url(#dm-body)" stroke-width="9" stroke-linecap="round"/>

<!-- capsule. grille on top, solid body under it -->
<path d="M30 34a30 30 0 0 1 60 0v116q0 10-10 10H40q-10 0-10-10z" fill="url(#dm-body)"/>
<path d="M31 34a29 29 0 0 1 58 0v48H31z" fill="url(#dm-grille)"/>
<g stroke="#0d0913" stroke-opacity=".45" stroke-width="1.2">
  <path d="M33 14h54M31 24h58M31 34h58M31 44h58M31 54h58M31 64h58M31 74h58"/>
  <path d="M40 10v72M50 6v76M60 5v77M70 6v76M80 10v72"/>
</g>
<path d="M31 82h58v5H31z" fill="#1a1422"/>
<path d="M36 30a24 24 0 0 1 12-20v70h-12z" fill="#ffffff" opacity=".12"/>
<!-- mute button, lit. pink so it belongs to the sign on the wall -->
<circle cx="60" cy="108" r="7" fill="#1a1422" stroke="#5d5369" stroke-width="1.5"/>
<circle cx="60" cy="108" r="3.5" fill="#ff5fae" opacity=".85"/>
<circle cx="60" cy="136" r="9" fill="#221b2b" stroke="#5d5369" stroke-width="1.5"/>
<path d="M60 128v5" stroke="#b3a7bf" stroke-width="2" stroke-linecap="round"/>

<circle cx="20" cy="112" r="8" fill="#2b2433" stroke="#6d6279" stroke-width="2"/>
<circle cx="100" cy="112" r="8" fill="#2b2433" stroke="#6d6279" stroke-width="2"/>
</svg>
