<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#233}</style></head>
<body>
<div id="stage" style="width:1000px;height:1000px"></div>
<script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>
<script src="js/live2d.js"></script>
<script src="js/outfit.js"></script>
<script>
(async () => {
  try{
    const q = new URLSearchParams(location.search);
    await Live2D.init({ stageEl: document.getElementById('stage'), onStatus: s => console.log(s) });
    Live2D.fitModel && Live2D.fitModel();
    Outfit.applyAll();
    if (q.get('arm')) Outfit.setVariant('arm_style', +q.get('arm'));
    if (q.get('leg')) Outfit.setVariant('leg_style', +q.get('leg'));
    document.body.style.outline='20px solid lime';
  }catch(e){ const d=document.createElement('div');d.textContent='ERR: '+(e&&e.stack||e);d.style.cssText='color:red;font:20px monospace;background:#fff;position:fixed;top:0;left:0;z-index:9;white-space:pre-wrap;';document.body.appendChild(d); console.error(e); }
})();
</script>
<img src="/wait.gif" width="1" height="1">
</body></html>
