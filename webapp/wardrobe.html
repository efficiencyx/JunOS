<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jun's Wardrobe</title>
<link rel="icon" type="image/png" href="jun_os.png">
<style>
/* Dressing-room look: independent from the app's styles.css on purpose,
   so this page can be styled freely. The wd-* / wardrobe-overlay classes
   are generated by Outfit's wardrobe builder (js/outfit.js).
   Atelier-at-night aesthetic: deep plum walls, a lavender key light and a
   thin thread of gold. No webfonts (CSP is self-only) - the display face
   leans on the platform's serif instead. */
:root {
  --panel-w: 424px;
  --bg-2: #14121a;
  --bg-3: #1f1b29;
  --bg-4: #262033;
  --border: #322b45;
  --border-2: #4a4066;
  --fg: #efeaf7;
  --muted: #9a90b5;
  --accent: #d4a5ff;
  --accent-soft: rgba(212,165,255,0.16);
  --gold: #d9b878;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font: 14px/1.45 system-ui, sans-serif;
  color: var(--fg);
  background:
    radial-gradient(ellipse 60% 75% at 38% 45%, #2a2140 0%, transparent 70%),
    linear-gradient(180deg, #171320 0%, #0e0c13 100%);
  overflow: hidden;
}
button.ghost {
  background: none; border: 0; color: var(--muted);
  cursor: pointer; padding: 4px 8px; border-radius: 6px;
}
button.ghost:hover { color: var(--fg); background: var(--bg-3); }
button:focus-visible, .wd-tile:focus-visible, .wd-swatch:focus-within {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* Stage: everything left of the panel. A soft spotlight sits under Jun. */
#stage { position: fixed; inset: 0 var(--panel-w) 0 0; }
.spotlight {
  position: fixed;
  left: calc((100vw - var(--panel-w)) / 2 - 260px);
  bottom: -60px;
  width: 520px; height: 200px;
  border-radius: 50%;
  background: radial-gradient(ellipse at center, rgba(212,165,255,0.14), transparent 70%);
  pointer-events: none;
}
.page-title {
  position: fixed; top: 26px; left: 30px;
  font-family: var(--serif);
  font-size: 26px; font-style: italic; letter-spacing: 0.04em;
  color: var(--muted);
  pointer-events: none;
}
.page-title b { color: var(--accent); font-weight: 600; }
.page-title::after {
  content: ""; display: block; margin-top: 8px;
  width: 64px; height: 1px;
  background: linear-gradient(90deg, var(--gold), transparent);
}
#stageStatus {
  position: fixed; left: 30px; bottom: 20px;
  font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--muted); opacity: 0.85;
}

/* The wardrobe panel (markup built by outfit.js). */
.wardrobe-overlay {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: var(--panel-w);
  display: none;
  flex-direction: column;
  background: linear-gradient(180deg, var(--bg-2), #100d17);
  border-left: 1px solid var(--border);
  box-shadow: -24px 0 60px rgba(0,0,0,0.5);
  z-index: 60;
}
body.wardrobe-open .wardrobe-overlay { display: flex; animation: wd-slide-in 0.35s cubic-bezier(0.2, 0.8, 0.2, 1); }
@keyframes wd-slide-in { from { transform: translateX(24px); opacity: 0; } }

.wd-head {
  display: flex; align-items: center; gap: 10px;
  padding: 18px 16px 14px 20px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, rgba(212,165,255,0.05), transparent);
}
.wd-titles { flex: 1; min-width: 0; }
.wd-title {
  display: block;
  font-family: var(--serif);
  font-size: 21px; font-style: italic; letter-spacing: 0.03em;
  color: var(--accent);
}
.wd-hint { display: block; margin-top: 3px; font-size: 11px; color: var(--muted); }
.wd-actions { display: flex; align-items: center; gap: 4px; }
.wd-reset {
  border: 1px solid var(--border-2); color: var(--muted);
  font: inherit; font-size: 11px; white-space: nowrap;
}
.wd-reset:hover { border-color: var(--accent); color: var(--fg); }
.wd-close { font-size: 22px; line-height: 1; align-self: flex-start; }

/* Rail + scrollable body side by side. */
.wd-main { flex: 1; display: flex; min-height: 0; }
.wd-rail {
  width: 64px; flex: none;
  display: flex; flex-direction: column; gap: 4px;
  padding: 12px 8px;
  border-right: 1px solid var(--border);
  background: rgba(0,0,0,0.18);
}
.wd-nav {
  position: relative;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 8px 2px;
  border: 0; border-radius: 10px;
  background: none; color: var(--muted);
  cursor: pointer; font: inherit;
  transition: background 0.15s, color 0.15s;
}
.wd-nav i { font-style: normal; font-size: 16px; filter: grayscale(1) opacity(0.7); transition: filter 0.15s; }
.wd-nav span { font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; }
.wd-nav:hover { color: var(--fg); background: var(--bg-3); }
.wd-nav.on { color: var(--accent); background: var(--accent-soft); }
.wd-nav.on i { filter: none; }
.wd-nav.on::before {
  content: ""; position: absolute; left: -8px; top: 20%; bottom: 20%;
  width: 2px; border-radius: 2px; background: var(--accent);
}

/* position:relative so section offsetTop is measured against this scroll
   container (the rail's scroll-to and active-state math depend on it). */
.wd-body { position: relative; flex: 1; overflow-y: auto; padding: 4px 16px 28px; scrollbar-width: thin; scrollbar-color: var(--border-2) transparent; }
.wd-body::-webkit-scrollbar { width: 6px; }
.wd-body::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 3px; }
.wd-section {
  display: flex; align-items: center; gap: 10px;
  margin: 20px 0 10px;
  font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.14em;
  color: var(--gold);
}
.wd-section::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border-2), transparent); }
.wd-section.wd-sub { margin-top: 14px; color: var(--muted); letter-spacing: 0.1em; }
.wd-section.wd-sub::after { background: linear-gradient(90deg, var(--border), transparent); }

.wd-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(94px, 1fr));
  gap: 10px;
}
.wd-tile {
  position: relative;
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  padding: 12px 4px 9px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: linear-gradient(180deg, var(--bg-4), var(--bg-3));
  cursor: grab;
  user-select: none; -webkit-user-select: none;
  touch-action: none;
  text-align: center;
  transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
}
.wd-tile:hover {
  border-color: var(--border-2);
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(0,0,0,0.35);
}
.wd-tile:active { cursor: grabbing; }
.wd-tile.on {
  border-color: var(--accent);
  background: linear-gradient(180deg, #2d2440, var(--bg-3));
  box-shadow: 0 0 0 1px var(--accent) inset, 0 0 18px var(--accent-soft);
}
.wd-tile.on::after {
  content: "✓"; position: absolute; top: -7px; left: -7px;
  width: 18px; height: 18px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700;
  background: var(--accent); color: #1a1224;
  box-shadow: 0 2px 6px rgba(0,0,0,0.4);
}
.wd-tile:focus-visible { transform: translateY(-2px); }
.wd-tile img, .wd-noimg { width: 58px; height: 58px; object-fit: contain; pointer-events: none; }
.wd-noimg { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 20px; }
.wd-tile span { font-size: 11px; color: var(--muted); }
.wd-tile.on span { color: var(--fg); }
body.wd-over-worn-item { cursor: grab; }

/* Tint swatch bundled in a tile's top-right corner. Hidden until the tile is
   hovered unless a tint is set; a rainbow ring means "no tint yet". */
.wd-swatch {
  position: absolute; top: 6px; right: 6px;
  display: flex; overflow: hidden; padding: 0;
  width: 20px; height: 20px; border-radius: 50%;
  border: 1px solid var(--border-2);
  background:
    radial-gradient(circle at center, var(--bg-3) 0 42%, transparent 45%),
    conic-gradient(#f66, #fc6, #7d6, #6cf, #a6f, #f66);
  cursor: pointer;
  opacity: 0; transform: scale(0.85);
  transition: opacity 0.15s, transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 2px 6px rgba(0,0,0,0.45);
}
.wd-tile:hover .wd-swatch, .wd-swatch.set { opacity: 1; transform: scale(1); }
.wd-swatch:hover { transform: scale(1.2); box-shadow: 0 3px 9px rgba(0,0,0,0.55); }
.wd-swatch.set { border-color: rgba(255,255,255,0.55); }
.color-preview-segment { display: block; flex: 1 1 0; height: 100%; min-width: 0; pointer-events: none; }
.color-preview-segment + .color-preview-segment { border-left: 1px solid rgba(255,255,255,0.65); }
.color-preview-segment.unset {
  background:
    radial-gradient(circle at center, var(--bg-3) 0 35%, transparent 38%),
    conic-gradient(#f66, #fc6, #7d6, #6cf, #a6f, #f66) !important;
}

/* Color studio: tints with no tile to live on (skin, face, eyes...). */
.wd-chips { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.wd-chip {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 7px 10px;
  border: 1px solid var(--border); border-radius: 10px;
  background: var(--bg-3);
  font-size: 12px; color: var(--muted);
  transition: border-color 0.15s, color 0.15s;
}
.wd-chip:hover { border-color: var(--border-2); color: var(--fg); }
/* Color-studio swatches sit inline instead of in a tile corner. */
.wd-chip .wd-swatch { position: relative; top: auto; right: auto; flex: none; opacity: 1; transform: none; }

.wd-tooltip {
  position: fixed; display: none; z-index: 62;
  padding: 5px 9px; font-size: 11px;
  background: var(--bg-3); color: var(--fg);
  border: 1px solid var(--accent);
  border-radius: 6px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.45);
  pointer-events: none; white-space: nowrap;
}
.wd-ghost {
  position: fixed; display: none; z-index: 63;
  width: 58px; height: 58px; object-fit: contain;
  opacity: 0.85; pointer-events: none;
  filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
}

/* Browser-independent HSV picker. Multi-color items switch channels here. */
.omega-color-picker {
  --picker-hue: #f00;
  position: fixed; z-index: 10000;
  width: 284px; padding: 13px;
  color: var(--fg); background: var(--bg-2);
  border: 1px solid var(--border-2); border-radius: 12px;
  box-shadow: 0 18px 55px rgba(0,0,0,.58);
  font: 12px/1.35 system-ui, sans-serif;
}
.omega-color-picker[hidden] { display: none; }
.ocp-head { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; }
.ocp-head > div { display: flex; flex-direction: column; }
.ocp-title { font-size: 14px; font-weight: 650; color: var(--fg); }
.ocp-head span { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.ocp-close {
  border: 0; background: transparent; color: var(--muted); cursor: pointer;
  font: 18px/1 system-ui, sans-serif; padding: 1px 4px; border-radius: 4px;
}
.ocp-close:hover { color: var(--fg); background: var(--bg-3); }
.ocp-channels { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
.ocp-channels[hidden] { display: none; }
.ocp-channel {
  display: flex; align-items: center; gap: 6px; flex: 1;
  min-width: calc(50% - 3px); padding: 6px 8px; border: 1px solid var(--border); border-radius: 7px;
  background: var(--bg-3); color: var(--muted); cursor: pointer; font: inherit;
}
.ocp-channel.active { border-color: var(--accent); color: var(--fg); background: var(--accent-soft); }
.ocp-channel i, .ocp-current {
  display: block; width: 14px; height: 14px; flex: none;
  border: 1px solid rgba(255,255,255,.5); border-radius: 50%;
}
.ocp-channel i.unset { background: conic-gradient(#f66, #fc6, #7d6, #6cf, #a6f, #f66) !important; }
.ocp-sv {
  position: relative; height: 148px; border-radius: 8px; cursor: crosshair;
  background: linear-gradient(to top, #000, transparent), linear-gradient(to right, #fff, transparent), var(--picker-hue);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); touch-action: none;
}
.ocp-sv-thumb, .ocp-hue-thumb {
  position: absolute; display: block; pointer-events: none;
  border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.65), 0 1px 4px rgba(0,0,0,.5);
}
.ocp-sv-thumb { width: 13px; height: 13px; border-radius: 50%; transform: translate(-50%,-50%); }
.ocp-hue {
  position: relative; height: 14px; margin: 10px 1px; border-radius: 8px; cursor: ew-resize;
  background: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); touch-action: none;
}
.ocp-hue-thumb { top: 50%; width: 5px; height: 18px; border-radius: 3px; transform: translate(-50%,-50%); }
.ocp-value-row {
  display: flex; align-items: center; gap: 7px; height: 34px;
  padding: 5px 8px; margin-top: 2px; border: 1px solid var(--border);
  border-radius: 7px; background: var(--bg-3);
}
.ocp-current { width: 20px; height: 20px; border-radius: 5px; }
.ocp-hex {
  width: 100%; min-width: 0; padding: 0; border: 0; outline: 0;
  background: transparent; color: var(--fg); font: 12px ui-monospace, monospace;
}
.ocp-hex.invalid { color: #ff8a8a; }
.ocp-presets { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; margin-top: 10px; }
.ocp-presets button { aspect-ratio: 1; padding: 0; border: 1px solid rgba(255,255,255,.25); border-radius: 50%; cursor: pointer; }
.ocp-presets button:hover { transform: scale(1.15); }
.ocp-clear {
  width: 100%; margin-top: 10px; padding: 6px; border: 1px solid var(--border);
  border-radius: 7px; background: transparent; color: var(--muted); cursor: pointer; font: inherit;
}
.ocp-clear:hover:not(:disabled) { border-color: var(--border-2); color: var(--fg); }
.ocp-clear:disabled { opacity: .55; cursor: default; }
.ocp-sv:focus-visible, .ocp-hue:focus-visible, .ocp-channel:focus-visible,
.ocp-close:focus-visible, .ocp-presets button:focus-visible, .ocp-clear:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}

@media (max-width: 700px) {
  #stage { inset: 0 0 46vh 0; }
  .wardrobe-overlay { top: auto; left: 0; width: 100%; height: 46vh; border-left: 0; border-top: 1px solid var(--border); }
  .wd-rail { width: 56px; padding: 10px 6px; }
  .spotlight, .page-title { display: none; }
  /* No hover on touch: keep every tint swatch visible. */
  .wd-swatch { opacity: 1; transform: none; }
}
</style>
</head>
<body>
<div class="spotlight" aria-hidden="true"></div>
<div class="page-title">Jun's <b>Wardrobe</b></div>
<div id="stage"></div>
<div id="stageStatus">Loading…</div>

<script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>
<script src="js/auth.js?v=6"></script>
<script src="js/prefs.js?v=2"></script>
<script src="js/live2d.js?v=17"></script>
<script src="js/mods.js?v=9"></script>
<script src="js/outfit.js?v=21"></script>
<script src="js/wardrobe.js?v=1"></script>
</body>
</html>
