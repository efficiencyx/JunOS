<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jun's Wardrobe</title>
<style>
/* Dressing-room look: independent from the app's styles.css on purpose,
   so this page can be styled freely. The wd-* / wardrobe-overlay classes
   are generated by Outfit's wardrobe builder (js/outfit.js). */
:root {
  --bg-2: #14121a;
  --bg-3: #1f1b29;
  --border: #322b45;
  --border-2: #4a4066;
  --fg: #efeaf7;
  --muted: #9a90b5;
  --accent: #d4a5ff;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font: 14px/1.45 system-ui, sans-serif;
  color: var(--fg);
  background:
    radial-gradient(ellipse 60% 75% at 38% 45%, #2a2140 0%, transparent 70%),
    linear-gradient(180deg, #171320 0%, #0e0c13 100%);
  overflow: hidden;
}
button.ghost {
  background: none; border: 0; color: var(--muted);
  cursor: pointer; padding: 4px 8px; border-radius: 6px;
}
button.ghost:hover { color: var(--fg); background: var(--bg-3); }

/* Stage: everything left of the panel. A soft spotlight sits under Jun. */
#stage { position: fixed; inset: 0 360px 0 0; }
.spotlight {
  position: fixed;
  left: calc((100vw - 360px) / 2 - 260px);
  bottom: -60px;
  width: 520px; height: 200px;
  border-radius: 50%;
  background: radial-gradient(ellipse at center, rgba(212,165,255,0.14), transparent 70%);
  pointer-events: none;
}
.page-title {
  position: fixed; top: 22px; left: 28px;
  font-size: 22px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--muted);
  pointer-events: none;
}
.page-title b { color: var(--accent); font-weight: 600; }
#stageStatus {
  position: fixed; left: 28px; bottom: 20px;
  font-size: 12px; color: var(--muted);
}

/* The wardrobe panel (markup built by outfit.js). */
.wardrobe-overlay {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: 360px;
  display: none;
  flex-direction: column;
  background: linear-gradient(180deg, var(--bg-2), #100d17);
  border-left: 1px solid var(--border);
  box-shadow: -18px 0 40px rgba(0,0,0,0.45);
  z-index: 60;
}
body.wardrobe-open .wardrobe-overlay { display: flex; }

.wd-head {
  display: flex; align-items: center; gap: 10px;
  padding: 16px;
  border-bottom: 1px solid var(--border);
}
.wd-head > span:first-child {
  font-size: 15px; font-weight: 600;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent);
}
.wd-hint { flex: 1; font-size: 11px; color: var(--muted); }
.wd-close { font-size: 20px; line-height: 1; }

.wd-body { overflow-y: auto; padding: 12px 16px 24px; }
.wd-body::-webkit-scrollbar { width: 6px; }
.wd-body::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 3px; }
.wd-section {
  margin: 16px 0 8px;
  font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--muted);
}
.wd-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
  gap: 10px;
}
.wd-tile {
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  padding: 10px 4px 8px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg-3);
  cursor: grab;
  user-select: none; -webkit-user-select: none;
  touch-action: none;
  text-align: center;
  transition: border-color 0.12s, transform 0.12s;
}
.wd-tile:hover { border-color: var(--border-2); transform: translateY(-1px); }
.wd-tile.on {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent) inset, 0 0 14px rgba(212,165,255,0.18);
}
.wd-tile img, .wd-noimg { width: 58px; height: 58px; object-fit: contain; pointer-events: none; }
.wd-noimg { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 20px; }
.wd-tile span { font-size: 11px; color: var(--muted); }
.wd-tile.on span { color: var(--fg); }
body.wd-over-worn-item { cursor: grab; }

.wd-tooltip {
  position: fixed; display: none; z-index: 62;
  padding: 5px 9px; font-size: 11px;
  background: var(--bg-3); color: var(--fg);
  border: 1px solid var(--accent);
  border-radius: 6px;
  pointer-events: none; white-space: nowrap;
}
.wd-ghost {
  position: fixed; display: none; z-index: 63;
  width: 58px; height: 58px; object-fit: contain;
  opacity: 0.85; pointer-events: none;
  filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
}

@media (max-width: 700px) {
  #stage { inset: 0 0 42vh 0; }
  .wardrobe-overlay { top: auto; left: 0; width: 100%; height: 42vh; border-left: 0; border-top: 1px solid var(--border); }
  .spotlight { display: none; }
}
</style>
</head>
<body>
<div class="spotlight" aria-hidden="true"></div>
<div class="page-title">Jun's <b>Wardrobe</b></div>
<div id="stage"></div>
<div id="stageStatus">Loading…</div>

<script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>
<script src="js/auth.js?v=6"></script>
<script src="js/prefs.js?v=2"></script>
<script src="js/live2d.js?v=15"></script>
<script src="js/outfit.js?v=16"></script>
<script src="js/wardrobe.js?v=1"></script>
</body>
</html>
