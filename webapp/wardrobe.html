<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<script defer src="js/viewport.js?v=3"></script>
<title>Annalie's Shop</title>
<link rel="icon" type="image/png" href="jun_os.png">
<link rel="stylesheet" href="trip-loader.css?v=1">
<style>
:root {
  --panel-w: 440px;
  --panel-h: clamp(280px, 52dvh, 440px);
  --bg-2: #16141e;
  --bg-3: #1c1a26;
  --bg-4: #232030;
  --border: rgba(255,255,255,0.06);
  --border-2: rgba(255,255,255,0.14);
  --fg: #e8e4f0;
  --muted: rgba(255,255,255,0.45);
  --accent: #c4a0f0;
  --accent-soft: rgba(196,160,240,0.1);
  --gold: rgba(255,255,255,0.3);
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; height: 100dvh; }
body {
  margin: 0;
  font: 14px/1.45 system-ui, sans-serif;
  color: var(--fg);
  background:
    radial-gradient(ellipse 60% 75% at 38% 45%, #2a2140 0%, transparent 70%),
    linear-gradient(180deg, #171320 0%, #0e0c13 100%);
  overflow: hidden;
}
button.ghost {
  background: none; border: 0; color: var(--muted);
  cursor: pointer; padding: 4px 8px; border-radius: 6px;
}
button.ghost:hover { color: var(--fg); background: var(--bg-3); }
button:focus-visible, .wd-tile:focus-visible, .wd-swatch:focus-within {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

#stage { position: fixed; inset: 0 var(--panel-w) 0 0; }
.spotlight {
  position: fixed;
  left: calc((100vw - var(--panel-w)) / 2 - 260px);
  bottom: -60px;
  width: 520px; height: 200px;
  border-radius: 50%;
  background: radial-gradient(ellipse at center, rgba(196,160,240,0.14), transparent 70%);
  pointer-events: none;
}
.page-title {
  position: fixed; top: 26px; left: 30px;
  font-family: var(--serif);
  font-size: 26px; font-style: italic; letter-spacing: 0.04em;
  color: var(--muted);
  pointer-events: none;
}
.page-title b { color: var(--accent); font-weight: 600; }
.page-title::after {
  content: ""; display: block; margin-top: 8px;
  width: 64px; height: 1px;
  background: linear-gradient(90deg, var(--gold), transparent);
}
#stageStatus {
  position: fixed; left: 30px; bottom: 20px;
  font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--muted); opacity: 0.85;
}

.wardrobe-overlay {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: var(--panel-w);
  display: none;
  flex-direction: column;
  background: linear-gradient(180deg, var(--bg-2) 0%, #110f18 100%);
  border-left: 1px solid var(--border);
  box-shadow: -24px 0 60px rgba(0,0,0,0.5);
  z-index: 60;
}
body.wardrobe-open .wardrobe-overlay { display: flex; animation: wd-slide-in 0.35s cubic-bezier(0.2, 0.8, 0.2, 1); }
@keyframes wd-slide-in { from { transform: translateX(24px); opacity: 0; } }

.wd-head {
  display: flex; align-items: center; gap: 10px;
  padding: 20px 16px 16px 22px;
  border-bottom: 1px solid var(--border);
}
.wd-titles { flex: 1; min-width: 0; }
.wd-title {
  display: block;
  font-size: 18px; font-weight: 600; letter-spacing: -0.01em;
  color: var(--fg);
}
.wd-hint { display: block; margin-top: 2px; font-size: 11px; color: rgba(255,255,255,0.35); letter-spacing: 0.02em; }
.wd-actions { display: flex; align-items: center; gap: 6px; }
.wd-reset, .wd-looks {
  border: 1px solid rgba(255,255,255,0.08); color: rgba(255,255,255,0.4);
  font: inherit; font-size: 11px; white-space: nowrap;
  padding: 5px 10px; border-radius: 6px;
  transition: border-color 0.15s, color 0.15s;
}
.wd-reset:hover, .wd-looks:hover { border-color: rgba(196,160,240,0.4); color: var(--accent); background: none; }
.wd-looks.on { border-color: rgba(196,160,240,0.4); color: var(--accent); background: var(--accent-soft); }

/* No z-index here on purpose: backdrop / #stage / dialog must interleave in the
   root stacking context so the live model shows through the right-hand pane. */
.wd-looks-modal { position: fixed; inset: 0; pointer-events: none; }
.wd-looks-modal[hidden] { display: none; }
.wd-looks-backdrop { position: absolute; inset: 0; z-index: 78; pointer-events: auto; background: rgba(8,6,12,0.72); backdrop-filter: blur(2px); }
.wd-looks-dialog {
  position: absolute; inset: 0;
  display: grid; grid-template-columns: minmax(260px, 320px) 1fr;
  gap: 14px;
  width: min(920px, calc(100vw - 48px));
  height: min(620px, calc(100dvh - 64px));
  margin: auto;
  pointer-events: none;
}

.wd-looks-side {
  position: relative; z-index: 80; pointer-events: auto;
  display: flex; flex-direction: column;
  min-height: 0;
  padding: 14px 14px 16px;
  border: 1px solid var(--border-2); border-radius: 14px;
  background: var(--bg-3);
  box-shadow: 0 18px 48px rgba(0,0,0,0.55);
}
/* Deliberately transparent: #stage is repositioned into this box while open. */
.wd-looks-stage {
  position: relative; z-index: 80; pointer-events: none;
  border: 1px solid var(--border); border-radius: 14px;
  background: none;
  box-shadow: inset 0 0 90px rgba(196,160,240,0.06);
}
body.looks-open #stage { z-index: 79; }
/* The panel sits under the backdrop but keeps its own compositing layer, so it
   needs the blur applied directly to read as dimmed with everything else. */
body.looks-open .wardrobe-overlay {
  filter: blur(3px) saturate(0.85) brightness(0.7);
  pointer-events: none;
}
.wd-looks-save { display: flex; gap: 6px; margin-bottom: 10px; }
.wd-looks-name {
  flex: 1; min-width: 0;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.08); border-radius: 6px;
  color: var(--fg); font: inherit; font-size: 12px;
  padding: 6px 8px;
}
.wd-looks-name::placeholder { color: rgba(255,255,255,0.25); }
.wd-looks-name:focus { outline: none; border-color: rgba(196,160,240,0.4); }
.wd-looks-add {
  flex: none;
  border: 1px solid rgba(196,160,240,0.25); border-radius: 6px;
  color: var(--accent); font: inherit; font-size: 11px;
  padding: 6px 10px;
}
.wd-looks-add:hover { background: var(--accent-soft); color: var(--accent); }
.wd-looks-list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; scrollbar-width: thin; }
.wd-look {
  display: flex; align-items: stretch; gap: 2px;
  border: 1px solid var(--border); border-radius: 8px;
  background: rgba(255,255,255,0.02);
  transition: border-color 0.15s, background 0.15s;
}
.wd-look:hover { border-color: var(--border-2); }
.wd-look.on { border-color: rgba(196,160,240,0.25); background: var(--accent-soft); }
.wd-look-main {
  flex: 1; min-width: 0;
  display: flex; align-items: baseline; gap: 8px;
  padding: 8px 10px;
  border: 0; border-radius: 8px 0 0 8px;
  background: none; color: var(--fg);
  font: inherit; font-size: 13px; text-align: left; cursor: pointer;
}
.wd-look-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wd-look-date { flex: none; font-size: 10px; color: rgba(255,255,255,0.3); }
.wd-look-del {
  flex: none; width: 30px;
  border: 0; border-radius: 0 8px 8px 0;
  background: none; color: rgba(255,255,255,0.25);
  font: 16px/1 system-ui, sans-serif; cursor: pointer;
}
.wd-look-del:hover { color: #e08a8a; background: rgba(255,255,255,0.04); }
.wd-looks-empty { padding: 14px 4px; font-size: 12px; color: var(--muted); line-height: 1.5; }
.wd-looks-hint { margin-top: 10px; font-size: 10px; color: rgba(255,255,255,0.3); letter-spacing: 0.02em; }
.wd-close { font-size: 18px; line-height: 1; width: 28px; height: 28px; padding: 0; color: rgba(255,255,255,0.35); }
.wd-close:hover { color: var(--fg); background: rgba(255,255,255,0.05); }

.wd-main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.wd-rail {
  flex: none;
  display: flex; gap: 2px;
  padding: 10px 22px 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  overflow-x: auto; scrollbar-width: none;
}
.wd-nav {
  position: relative;
  display: flex; align-items: center; gap: 5px;
  padding: 8px 14px;
  border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px;
  border-radius: 0;
  background: none; color: rgba(255,255,255,0.4);
  cursor: pointer; font: inherit; font-size: 12px; font-weight: 500;
  white-space: nowrap;
  transition: color 0.15s, border-color 0.15s;
}
.wd-nav i { display: none; }
.wd-nav:hover { color: var(--fg); }
.wd-nav.on { color: var(--accent); border-bottom-color: var(--accent); }

/* Required for the rail's scroll-position calculations. */
.wd-body { position: relative; flex: 1; overflow-y: auto; padding: 16px 22px 28px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.08) transparent; }
.wd-body::-webkit-scrollbar { width: 6px; }
.wd-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
.wd-section {
  display: flex; align-items: center; gap: 8px;
  margin: 20px 0 10px;
  font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.1em;
  color: rgba(255,255,255,0.3);
}

.wd-expand {
  border: 0; background: none; padding: 0 6px;
  color: rgba(255,255,255,0.35); font: inherit; font-size: 12px; line-height: 1;
  cursor: pointer;
  transition: transform 0.15s, color 0.15s;
}
.wd-expand:hover { color: var(--fg); }
.wd-expand.on { transform: rotate(180deg); }
.wd-section:first-child { margin-top: 0; }
.wd-section.wd-sub { margin-top: 14px; color: rgba(255,255,255,0.22); }

.wd-grid {
  display: flex; gap: 10px;
  overflow-x: auto;
  padding: 4px 2px 6px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.wd-grid::-webkit-scrollbar { display: none; }
.wd-grid.expanded {
  flex-wrap: wrap;
  overflow-x: hidden; overflow-y: auto;
  max-height: 330px;
}
.wd-tile {
  position: relative;
  flex: none; width: 88px;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 10px 6px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: rgba(255,255,255,0.02);
  cursor: grab;
  user-select: none; -webkit-user-select: none;
  touch-action: pan-x pan-y;
  text-align: center;
  transition: border-color 0.15s, background 0.15s, transform 0.15s, box-shadow 0.15s;
}
.wd-tile:hover {
  border-color: var(--border-2);
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(0,0,0,0.35);
}
.wd-tile:active { cursor: grabbing; }
.wd-tile.on {
  border-color: rgba(196,160,240,0.25);
  background: var(--accent-soft);
}
.wd-tile.on::after {
  content: "✓"; position: absolute; top: -4px; left: -4px;
  width: 16px; height: 16px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 700;
  background: var(--accent); color: #1a1224;
  box-shadow: 0 2px 6px rgba(0,0,0,0.4);
}
.wd-tile:focus-visible { transform: translateY(-2px); }
.wd-tile img, .wd-noimg {
  width: 52px; height: 52px; object-fit: contain; pointer-events: none;
  border-radius: 8px; background: rgba(255,255,255,0.04); padding: 2px;
}
.wd-noimg { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 20px; }
.wd-tile span { font-size: 10.5px; color: var(--muted); }
.wd-tile.on span { color: var(--fg); font-weight: 500; }
body.wd-over-worn-item { cursor: grab; }

.wd-swatch {
  position: absolute; top: 6px; right: 6px;
  display: flex; overflow: hidden; padding: 0;
  width: 20px; height: 20px; border-radius: 50%;
  border: 1px solid var(--border-2);
  background:
    radial-gradient(circle at center, var(--bg-3) 0 42%, transparent 45%),
    conic-gradient(#f66, #fc6, #7d6, #6cf, #a6f, #f66);
  cursor: pointer;
  opacity: 0; transform: scale(0.85);
  transition: opacity 0.15s, transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 2px 6px rgba(0,0,0,0.45);
}
.wd-tile:hover .wd-swatch, .wd-swatch.set { opacity: 1; transform: scale(1); }
.wd-swatch:hover { transform: scale(1.2); box-shadow: 0 3px 9px rgba(0,0,0,0.55); }
.wd-swatch.set { border-color: rgba(255,255,255,0.55); }

.wd-optorb {
  position: absolute; bottom: 4px; right: 6px;
  display: flex; align-items: center; justify-content: center;
  width: 20px; height: 20px; padding: 0; border-radius: 50%;
  border: 1px solid var(--border-2);
  background: var(--bg-3);
  color: rgba(255,255,255,0.6);
  font-size: 12px; line-height: 1;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s, color 0.15s;
  box-shadow: 0 2px 6px rgba(0,0,0,0.45);
}
.wd-optorb:hover { transform: scale(1.15); box-shadow: 0 3px 9px rgba(0,0,0,0.55); color: var(--fg); }
.wd-optorb.set { border-color: rgba(196,160,240,0.6); color: var(--accent); }

.wd-optpop {
  position: fixed; z-index: 70;
  padding: 10px;
  border: 1px solid var(--border-2);
  border-radius: 12px;
  background: var(--bg-3);
  box-shadow: 0 12px 32px rgba(0,0,0,0.55);
  max-width: 356px;
}
.wd-optpop.wd-sheet {
  width: 100%; max-width: none;
  max-height: calc(var(--visual-viewport-height, 100dvh) - 8px);
  overflow-y: auto;
  padding: 14px calc(14px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
  border-radius: 18px 18px 0 0;
  border-bottom: 0;
  overscroll-behavior: contain;
}
.wd-optpop.wd-sheet .wd-optpop-grid { max-height: none; overflow: visible; }
.wd-optpop[hidden] { display: none; }
.wd-optpop-head {
  position: sticky; top: 0; z-index: 1;
  display: flex; align-items: center; gap: 8px;
  padding: 2px 0;
  margin-bottom: 8px;
  background: var(--bg-3);
}
.wd-optpop-title {
  flex: 1; min-width: 0;
  font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.1em;
  color: rgba(255,255,255,0.35);
}
.wd-optpop-close {
  position: relative;
  flex: none; width: 28px; height: 28px; padding: 0;
  border: 0; border-radius: 6px;
  background: transparent; color: var(--muted);
  font: 18px/1 system-ui, sans-serif; cursor: pointer;
}
.wd-optpop-close::before { content: ""; position: absolute; inset: -8px; }
.wd-optpop-close:hover { color: var(--fg); background: rgba(255,255,255,0.05); }
.wd-optpop-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.wd-optpop-row[hidden] { display: none; }
.wd-opt-equip {
  padding: 6px 14px;
  border: 1px solid var(--border-2); border-radius: 8px;
  background: var(--accent-soft); color: var(--fg);
  font: inherit; font-size: 11px; font-weight: 500;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.wd-opt-equip:hover { border-color: rgba(196,160,240,0.5); }
.wd-opt-equip.worn { background: rgba(255,255,255,0.04); }
.wd-optpop-color[hidden] { display: none; }
.omega-color-picker.ocp-embedded {
  position: static; z-index: auto;
  width: auto; max-width: 284px;
  padding: 10px 0 0; margin-top: 10px;
  background: none; border: 0; border-top: 1px solid var(--border);
  border-radius: 0; box-shadow: none;
}
.ocp-embedded .ocp-head .ocp-close { display: none; }

.wd-optpop-grid {
  display: flex; flex-wrap: wrap; gap: 8px;
  max-height: 300px; overflow-y: auto;
  scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.08) transparent;
}
.wd-optpop-subtitle {
  flex-basis: 100%;
  font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.1em;
  color: rgba(255,255,255,0.35);
}
.wd-opt {
  width: 74px;
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  padding: 8px 4px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: rgba(255,255,255,0.02);
  cursor: pointer; font: inherit; text-align: center;
  transition: border-color 0.15s, background 0.15s;
}
.wd-opt:hover { border-color: var(--border-2); }
.wd-opt.on { border-color: rgba(196,160,240,0.45); background: var(--accent-soft); }
.wd-opt img, .wd-opt .wd-noimg {
  width: 44px; height: 44px; object-fit: contain; pointer-events: none;
  border-radius: 8px; background: rgba(255,255,255,0.04); padding: 2px;
}
.wd-opt span { font-size: 10px; color: var(--muted); }
.wd-opt.on span { color: var(--fg); }
.color-preview-segment { display: block; flex: 1 1 0; height: 100%; min-width: 0; pointer-events: none; }
.color-preview-segment + .color-preview-segment { border-left: 1px solid rgba(255,255,255,0.65); }
.color-preview-segment.unset {
  background:
    radial-gradient(circle at center, var(--bg-3) 0 35%, transparent 38%),
    conic-gradient(#f66, #fc6, #7d6, #6cf, #a6f, #f66) !important;
}

.wd-tooltip {
  position: fixed; display: none; z-index: 62;
  padding: 5px 9px; font-size: 11px;
  background: var(--bg-3); color: var(--fg);
  border: 1px solid var(--accent);
  border-radius: 6px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.45);
  pointer-events: none; white-space: nowrap;
}
.wd-ghost {
  position: fixed; display: none; z-index: 63;
  width: 58px; height: 58px; object-fit: contain;
  opacity: 0.85; pointer-events: none;
  filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
}

.omega-color-picker {
  --picker-hue: #f00;
  position: fixed; z-index: 10000;
  width: 284px; padding: 13px;
  color: var(--fg); background: var(--bg-2);
  border: 1px solid var(--border-2); border-radius: 12px;
  box-shadow: 0 18px 55px rgba(0,0,0,.58);
  font: 12px/1.35 system-ui, sans-serif;
}
.omega-color-picker.ocp-sheet {
  width: 100%; max-width: none;
  max-height: calc(var(--visual-viewport-height, 100dvh) - 8px);
  overflow-y: auto;
  padding: 14px calc(14px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
  border-radius: 18px 18px 0 0;
  border-bottom: 0;
  overscroll-behavior: contain;
}
.omega-color-picker[hidden] { display: none; }
.ocp-head { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; }
.ocp-head > div { display: flex; flex-direction: column; }
.ocp-title { font-size: 14px; font-weight: 650; color: var(--fg); }
.ocp-head span { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.ocp-close {
  border: 0; background: transparent; color: var(--muted); cursor: pointer;
  font: 18px/1 system-ui, sans-serif; padding: 1px 4px; border-radius: 4px;
}
.ocp-close:hover { color: var(--fg); background: var(--bg-3); }
.ocp-channels { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
.ocp-channels[hidden] { display: none; }
.ocp-channel {
  display: flex; align-items: center; gap: 6px; flex: 1;
  min-width: calc(50% - 3px); padding: 6px 8px; border: 1px solid var(--border); border-radius: 7px;
  background: var(--bg-3); color: var(--muted); cursor: pointer; font: inherit;
}
.ocp-channel.active { border-color: var(--accent); color: var(--fg); background: var(--accent-soft); }
.ocp-channel i, .ocp-current {
  display: block; width: 14px; height: 14px; flex: none;
  border: 1px solid rgba(255,255,255,.5); border-radius: 50%;
}
.ocp-channel i.unset { background: conic-gradient(#f66, #fc6, #7d6, #6cf, #a6f, #f66) !important; }
.ocp-sv {
  position: relative; height: 148px; border-radius: 8px; cursor: crosshair;
  background: linear-gradient(to top, #000, transparent), linear-gradient(to right, #fff, transparent), var(--picker-hue);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); touch-action: none;
}
.ocp-sv-thumb, .ocp-hue-thumb {
  position: absolute; display: block; pointer-events: none;
  border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.65), 0 1px 4px rgba(0,0,0,.5);
}
.ocp-sv-thumb { width: 13px; height: 13px; border-radius: 50%; transform: translate(-50%,-50%); }
.ocp-hue {
  position: relative; height: 14px; margin: 10px 1px; border-radius: 8px; cursor: ew-resize;
  background: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); touch-action: none;
}
