services:
  ollama:
    build:
      args:
        OLLAMA_BASE: ollama/ollama:0.32.6-rocm
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "${VIDEO_GID:-video}"
      - "${RENDER_GID:-render}"
    environment:
      - HSA_OVERRIDE_GFX_VERSION
      - HIP_VISIBLE_DEVICES
      - ROCR_VISIBLE_DEVICES
      - OLLAMA_SCHED_SPREAD

  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan@sha256:9e44de245d8a3619a60cd42fbb553528e0ef3b0ea2420e44155950d7105a3eb3
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "${VIDEO_GID:-video}"
      - "${RENDER_GID:-render}"
    environment:
      - LLAMA_ARG_N_GPU_LAYERS=999
      - GGML_VK_VISIBLE_DEVICES
      - LLAMA_ARG_TENSOR_SPLIT
      - LLAMA_ARG_MAIN_GPU

# Only the karaoke sidecar gets a GPU; the voice sidecar stays CPU-only by
# design (see docker/tts.Dockerfile).
  karaoke:
    build:
      args:
        TORCH_INDEX: "${KARAOKE_TORCH_INDEX:-https://download.pytorch.org/whl/rocm6.2.4}"
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "${VIDEO_GID:-video}"
      - "${RENDER_GID:-render}"
    environment:
      - HSA_OVERRIDE_GFX_VERSION
