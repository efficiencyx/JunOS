services:
# `count: all` goes through the host's CDI spec, which is written once and goes
# stale when you add a card, and then it only hands over some of them. start.sh
# counts
# the GPUs itself and asks for that many, which takes the legacy path instead.
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${NVIDIA_GPU_COUNT:-all}
              capabilities: [gpu]
    environment:
      - CUDA_VISIBLE_DEVICES
      - OLLAMA_SCHED_SPREAD

  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${NVIDIA_GPU_COUNT:-all}
              capabilities: [gpu]
    environment:
      - LLAMA_ARG_N_GPU_LAYERS=999
      - CUDA_VISIBLE_DEVICES
      - LLAMA_ARG_SPLIT_MODE
      - LLAMA_ARG_TENSOR_SPLIT
      - LLAMA_ARG_MAIN_GPU
# Only the karaoke sidecar gets a GPU; the voice sidecar stays CPU-only by
# design (see docker/tts.Dockerfile).
  karaoke:
    build:
      args:
        TORCH_INDEX: "${KARAOKE_TORCH_INDEX:-https://download.pytorch.org/whl/cu124}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
