# NVIDIA overlay - requires nvidia-container-toolkit on the host.
#   docker compose -f docker-compose.yml -f docker-compose.nvidia.yml up -d
# (./start.sh applies this automatically when it finds an NVIDIA GPU.)
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Inert unless the llamacpp profile is active.
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    environment:
      LLAMA_ARG_N_GPU_LAYERS: "999"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
