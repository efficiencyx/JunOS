# NVIDIA overlay - requires nvidia-container-toolkit on the host.
#   docker compose -f docker-compose.yml -f docker-compose.nvidia.yml up -d
# (./start.sh applies this automatically when it finds an NVIDIA GPU.)
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # TTS sidecar on the GPU: rebuild against a CUDA torch wheel and reserve a GPU.
  # Kokoro-82M + pocket-tts are tiny (~1 GB) but share VRAM with the LLM - set
  # TTS_DEVICE=cpu to keep the sidecar on CPU on a tight card.
  kokoro:
    build:
      args:
        TORCH_INDEX: https://download.pytorch.org/whl/cu124
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
